name: Pull Request Workflow

on:
  pull_request:
    branches:
      - main

jobs:
  # Build and test C++ libraries.
  test_library_unix:
    strategy:
      matrix:
        include:
          - os: macos-15
            compiler: clang
            eigen: ON
          - os: macos-15
            compiler: clang
            eigen: OFF
          - os: ubuntu-24.04
            compiler: gcc
            eigen: ON
          - os: ubuntu-24.04
            compiler: gcc
            eigen: OFF
    continue-on-error: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ssciwr/doxygen-install@v2
      - name: Install boost
        uses: MarkusJx/install-boost@v2
        id: install-boost
        with:
          boost_version: 1.89.0
          platform_version: ${{ split(matrix.os, '-')[1] }}
          toolset: ${{ matrix.compiler }}
      - name: Build and Test
        run: |
          toolchain=${PWD}/.github/workflow_toolchains/${{matrix.compiler}}.cmake
          cmake -Bbuild -H. -GNinja -DCMAKE_TOOLCHAIN_FILE="${toolchain}" -DENABLE_EIGEN_SUPPORT=${{matrix.eigen}}
          cmake --build build --parallel
          cd build
          ctest -VV --no-tests=error
        env:
            BOOST_ROOT: ${{ steps.install-boost.outputs.BOOST_ROOT }}
        shell: bash

  test_library_windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ssciwr/doxygen-install@v2
      - name: Install boost
        uses: MarkusJx/install-boost@v2
        id: install-boost
        with:
          boost_version: 1.89.0
          platform_version: 2022
          toolset: msvc
      - name: Build and Test
        run: |
          SET "toolchain=%cd%\.github\workflow_toolchains\msvc.cmake"
          cmake -DCMAKE_TOOLCHAIN_FILE=%toolchain% -B "build" -G "Visual Studio 17 2022" -T host=x64 -A x64
          cmake --build build --config Debug --parallel
          cd build
          ctest -C Debug -T test -VV --no-tests=error
        env:
            BOOST_ROOT: ${{ steps.install-boost.outputs.BOOST_ROOT }}
        shell: cmd

  # Test Build of Documentation
  test_dox_build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ssciwr/doxygen-install@v1
      - name: Build Doxygen Part
        run: |
          cmake -Bbuild -H. -GNinja -DONLY_BUILD_DOCS=ON -DDOCS_FAIL_ON_WARNING=ON
          cmake --build build --target sigma_cxx_api --parallel
        shell: bash

  # Run pre-commit hooks
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Install and Run pre-commit
        run: |
          pip install -r requirements.txt
          pre-commit run --all-files
        shell: bash
